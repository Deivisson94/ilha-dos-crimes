<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ILHA DOS CRIMES - LoL Dashboard Mega Brain Mobile</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0b132b 0%, #0d1b3e 50%, #050814 100%);
      background-attachment: fixed;
      color: #94a3b8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #38bdf8, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, #818cf8, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 400px 400px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    header {
      background: rgba(18, 29, 58, 0.95);
      border-bottom: 1px solid #1e293b;
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 40; padding: 12px 16px;
    }

    .header-container {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    .logo-img { height: 48px; width: auto; max-width: 200px; object-fit: contain; display: block; }

    .btn-sync {
      padding: 8px 14px;
      background: linear-gradient(90deg, #38bdf8 0%, #6366f1 100%);
      color: #050814; font-weight: 800; border-radius: 10px; border: none;
      cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 11px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); transition: all 0.2s; white-space: nowrap;
    }

    .btn-sync:hover { opacity: 0.9; color: #fff; }

    main { max-width: 1280px; margin: 0 auto; padding: 16px; width: 100%; z-index: 10; flex: 1; }

    .banner-card {
      background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b;
      border-radius: 14px; padding: 16px; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 20px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.1);
      gap: 12px;
    }

    .table-container {
      background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b;
      border-radius: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 720px; }
    th { background: rgba(18, 29, 58, 0.9); padding: 12px 14px; font-size: 10px; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #1e293b; white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(30, 41, 59, 0.6); vertical-align: middle; }

    .btn-expand-player { padding: 6px 12px; background: #0b132b; border: 1px solid #1e293b; color: #fff; font-size: 10px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .btn-expand-player:hover { border-color: #38bdf8; }

    /* MENU DE ABAS DO JOGADOR COM SCROLL LATERAL PARA CELULAR */
    .player-main-nav { display: flex; gap: 6px; background: #121826; padding: 6px; border-radius: 10px; border: 1px solid #1e293b; margin-bottom: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .player-nav-btn { padding: 6px 14px; font-size: 11px; font-weight: 700; color: #94a3b8; background: transparent; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .player-nav-btn.active { background: #38bdf8; color: #050814; font-weight: 800; }

    .op-filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; background: #121826; padding: 8px 12px; border-radius: 8px; border: 1px solid #1e293b; flex-wrap: wrap; }
    .op-select { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 6px 10px; font-size: 11px; font-weight: 700; border-radius: 6px; outline: none; cursor: pointer; flex: 1; min-width: 130px; }

    /* CARDS DE RECOMENDAÇÃO (ESTILO) */
    .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .rec-card { background: #121826; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; position: relative; }
    .rec-badge { position: absolute; top: 8px; right: 8px; background: #d97706; color: #fff; font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 4px; }

    /* MAESTRIA */
    .mastery-header { display: flex; justify-content: space-around; background: #121826; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; margin-bottom: 12px; text-align: center; flex-wrap: wrap; gap: 10px; }
    .mastery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; }
    .mastery-card { background: #121826; border: 1px solid #1e293b; border-radius: 10px; padding: 10px 6px; text-align: center; position: relative; }
    .mastery-img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #38bdf8; object-fit: cover; }
    .mastery-badge-lvl { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: #d97706; color: #000; font-size: 8px; font-weight: 900; padding: 1px 5px; border-radius: 8px; border: 1px solid #fff; }

    /* CARDS DE PARTIDA COMPACTOS PARA CELULAR */
    .match-summary-card { border-radius: 10px; border: 1px solid #2a354d; margin-bottom: 8px; overflow: hidden; }
    .match-win-bg { background: rgba(16, 185, 129, 0.08); border-left: 4px solid #10b981; }
    .match-loss-bg { background: rgba(244, 63, 94, 0.08); border-left: 4px solid #f43f5e; }

    .match-summary-header { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; flex-wrap: wrap; }
    .btn-detail-match { padding: 4px 8px; background: #181e2b; border: 1px solid #2a354d; color: #38bdf8; font-size: 10px; font-weight: 700; border-radius: 6px; cursor: pointer; }

    .match-detail-content { background: #1c2333; border-top: 1px solid #2a354d; padding: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .player-row-op { display: grid; grid-template-columns: 2fr 0.8fr 1.2fr 1.2fr 1fr 1.5fr; padding: 6px 8px; font-size: 10px; align-items: center; border-bottom: 1px solid #222c40; min-width: 500px; }
    .item-icon { width: 18px; height: 18px; border-radius: 3px; border: 1px solid #2a354d; background: #0f172a; display: inline-block; vertical-align: middle; }

    .op-score-badge { font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 4px; background: #2a354d; color: #fff; }
    .bar-dmg { height: 5px; background: #f43f5e; border-radius: 3px; display: block; }
    .bar-dmg-blue { height: 5px; background: #38bdf8; border-radius: 3px; display: block; }

    @keyframes livePulse {
      0%   { transform: scale(0.9); opacity: 0.7; }
      50%  { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    .hidden { display: none !important; }

    footer { border-top: 1px solid #1e293b; background: rgba(18, 29, 58, 0.4); padding: 14px; text-align: center; font-size: 11px; color: #94a3b8; }

    /* AJUSTES ESPECÍFICOS PARA DISPOSITIVOS MÓVEIS */
    @media (max-width: 640px) {
      header { padding: 10px; }
      .header-container { flex-direction: column; text-align: center; gap: 8px; }
      .logo-img { height: 40px; }
      
      main { padding: 10px; }
      .banner-card { flex-direction: column; text-align: center; padding: 12px; }
      
      .match-summary-header { flex-direction: row; justify-content: space-between; }
      .player-row-op { font-size: 9px; }
    }
  </style>
</head>

  <header>
    <div class="header-container">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;">
        <img src="logo.png" onerror="this.onerror=null; this.src='logo.jpg';" class="logo-img">
        <div>
          <h1 style="color: #fff; font-size: 16px; font-weight: 900;" class="font-orbitron">ILHA DOS <span style="color: #38bdf8;">CRIMES</span></h1>
          <p style="font-size: 10px; color: #94a3b8;">Dashboard LoL BR (Mobile & Desktop)</p>
        </div>
      </div>
      <button onclick="location.reload()" class="btn-sync font-orbitron">
        <i data-lucide="refresh-cw" style="width: 12px; height: 12px;"></i>
        <span>SINCRONIZAR</span>
      </button>
    </div>
  </header>

  <main>
    <div class="banner-card">
      <div>
        <h2 class="font-orbitron" style="color: #fff; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; justify-content: center;">
          <i data-lucide="smartphone" style="color: #38bdf8; width: 16px;"></i> PAINEL COMPLETO OP.GG (MOBILE)
        </h2>
        <p style="font-size: 11px; color: #94a3b8; margin-top: 2px;">Acesso a todas as abas, partidas e estatísticas em qualquer dispositivo.</p>
      </div>
      <div style="text-align: center;">
        <span style="font-size: 9px; font-weight: 700;" class="font-orbitron">Invocadores</span>
        <span style="font-size: 18px; font-weight: 900; color: #38bdf8; display: block;" class="font-orbitron" id="monitoredCount">0</span>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr class="font-orbitron">
            <th>Invocador</th>
            <th>Ranked Solo</th>
            <th>Ranked Flex</th>
            <th>Mais Jogados</th>
            <th style="text-align: center;">Ação</th>
          </tr>
        </thead>
        <tbody id="summonersTableBody"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>ILHA DOS CRIMES © 2026 • Painel Integrado Riot Games API</p>
  </footer>

      IRON: 'Ferro', BRONZE: 'Bronze', SILVER: 'Prata', GOLD: 'Ouro',
      PLATINUM: 'Platina', EMERALD: 'Esmeralda', DIAMOND: 'Diamante',
      MASTER: 'Mestre', GRANDMASTER: 'Grão-Mestre', CHALLENGER: 'Desafiante', UNRANKED: 'Unranked'
    };

    window.addEventListener('DOMContentLoaded', () => {
      renderTable();
      if(window.lucide) lucide.createIcons();
    });

    function getChampImg(championName, ver) {
      if (!championName) return fallbackIcon;
      let formatted = championName.replace(/[^a-zA-Z0-9]/g, '');
      if (formatted.toLowerCase() === 'monkeyking') formatted = 'MonkeyKing';
      return `https://ddragon.leagueoflegends.com/cdn/${ver || '14.20.1'}/img/champion/${formatted}.png`;
    }

    function renderTable() {
      const tbody = document.getElementById('summonersTableBody');
      document.getElementById('monitoredCount').textContent = summoners.length;

      if (summoners.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 24px;">Nenhum dado carregado. Execute a atualização.</td></tr>`;
        return;
      }

      tbody.innerHTML = summoners.map(s => {
        const soloTotal = s.solo.wins + s.solo.losses;
        const soloWr = soloTotal > 0 ? Math.round((s.solo.wins / soloTotal) * 100) : 0;
        const flexTotal = s.flex.wins + s.flex.losses;
        const flexWr = flexTotal > 0 ? Math.round((s.flex.wins / flexTotal) * 100) : 0;
        const opggUrl = `https://www.op.gg/summoners/br/${encodeURIComponent(s.gameName)}-${encodeURIComponent(s.tagLine)}`;

        return `
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 8px;">
                <img src="${s.iconUrl}" onerror="this.src='${fallbackIcon}';" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #1e293b;">
                <div>
                  <div style="color: #fff; font-weight: 700; font-size: 12px;">${s.gameName} <span style="color: #38bdf8; font-size: 10px;">#${s.tagLine}</span>${s.liveGame && s.liveGame.inGame ? ' <span style="color: #f43f5e; font-size: 8px; font-weight: 900; border: 1px solid #f43f5e; border-radius: 4px; padding: 1px 4px; margin-left: 4px; white-space: nowrap;"><span style="display: inline-block; width: 5px; height: 5px; background: #f43f5e; border-radius: 50%; margin-right: 3px; animation: livePulse 1.5s infinite;"></span>AO VIVO</span>' : ''}</div>
                  <a href="${opggUrl}" target="_blank" style="color: #818cf8; font-size: 9px; text-decoration: none;">Perfil OP.GG ↗</a>
                </div>
              </div>
            </td>
            <td>
              <div>
                <span style="padding: 2px 4px; border-radius: 4px; font-size: 9px; font-weight: 900; background: rgba(56, 189, 248, 0.15); color: #38bdf8;" class="font-orbitron">${s.solo.tier}</span>
                <div style="font-size: 11px; font-weight: 800; color: #fff; margin-top: 2px;">${tierNamesPT[s.solo.tier] || s.solo.tier} ${s.solo.division} (${s.solo.lp} PDL)</div>
                <div style="font-size: 10px; color: #94a3b8;">${s.solo.wins}V ${s.solo.losses}D <span style="color: #10b981; font-weight: 700;">${soloWr}%</span></div>
              </div>
            </td>
            <td>
              <div>
                <span style="padding: 2px 4px; border-radius: 4px; font-size: 9px; font-weight: 900; background: rgba(56, 189, 248, 0.15); color: #38bdf8;" class="font-orbitron">${s.flex.tier}</span>
                <div style="font-size: 11px; font-weight: 800; color: #fff; margin-top: 2px;">${tierNamesPT[s.flex.tier] || s.flex.tier} ${s.flex.division} (${s.flex.lp} PDL)</div>
                <div style="font-size: 10px; color: #94a3b8;">${s.flex.wins}V ${s.flex.losses}D <span style="color: #10b981; font-weight: 700;">${flexWr}%</span></div>
              </div>
            </td>
            <td>
              <div style="display: flex; gap: 6px;">
                ${(s.topChampions || []).map(c => `
                  <div style="background: #121826; border: 1px solid #1e293b; border-radius: 6px; padding: 4px 6px; display: flex; align-items: center; gap: 6px;">
                    <img src="${getChampImg(c.champion, s.ddragonVer)}" onerror="this.src='${fallbackIcon}';" style="width: 26px; height: 26px; border-radius: 4px;">
                    <div>
                      <strong style="color: #fff; font-size: 10px; display: block;">${c.champion}</strong>
                      <span style="color: ${c.winRate >= 50 ? '#10b981' : '#f43f5e'}; font-weight: 800; font-size: 9px;">${c.winRate}%</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </td>
            <td style="text-align: center;">
              <button onclick="toggleExpand('${s.id}')" class="btn-expand-player font-orbitron">
                <i data-lucide="sliders" style="width: 10px; height: 10px;"></i> VER PAINEL
              </button>
            </td>
          </tr>

          <tr id="expand-${s.id}" class="hidden" style="background: #080c16;">
            <td colspan="5" style="padding: 10px;">
              
              <!-- TODAS AS ABAS PRESENVADAS COM SCROLL SUAVE NO CELULAR -->
              <div class="player-main-nav font-orbitron">
                <button onclick="switchPlayerTab('${s.id}', 'resumo')" id="pnav-resumo-${s.id}" class="player-nav-btn active">Resumo</button>
                <button onclick="switchPlayerTab('${s.id}', 'estilo')" id="pnav-estilo-${s.id}" class="player-nav-btn">Estilo</button>
                <button onclick="switchPlayerTab('${s.id}', 'campeoes')" id="pnav-campeoes-${s.id}" class="player-nav-btn">Campeões</button>
                <button onclick="switchPlayerTab('${s.id}', 'destaques')" id="pnav-destaques-${s.id}" class="player-nav-btn">Destaques</button>
                <button onclick="switchPlayerTab('${s.id}', 'maestria')" id="pnav-maestria-${s.id}" class="player-nav-btn">Maestria</button>
                <button onclick="switchPlayerTab('${s.id}', 'live')" id="pnav-live-${s.id}" class="player-nav-btn">Jogo ao vivo</button>
              </div>

              <!-- ABA 1: RESUMO -->
              <div id="ptab-resumo-${s.id}">
                <div class="op-filter-bar">
                  <select class="op-select" id="filter-queue-${s.id}" onchange="filterMatches('${s.id}')">
                    <option value="ALL">Todas as Filas</option>
                    <option value="SOLO">Ranqueada Solo/Duo</option>
                    <option value="FLEX">Ranqueada Flex</option>
                    <option value="ARAM">ARAM</option>
                  </select>
                  <select class="op-select" id="filter-year-${s.id}" onchange="filterMatches('${s.id}')">
                    <option value="ALL">Todas as Temporadas</option>
                    <option value="2026">Temporada 2026</option>
                    <option value="2025">Temporada 2025</option>
                  </select>
                </div>

                <div id="matches-container-${s.id}">
                  ${renderPlayerMatches(s.id, s.history, 'ALL', 'ALL', s.ddragonVer)}
                </div>
              </div>

              <!-- ABA 2: ESTILO (RECOMENDAÇÃO DE CAMPEÕES) -->
              <div id="ptab-estilo-${s.id}" class="hidden">
                <h4 style="font-size: 12px; color: #38bdf8; margin-bottom: 8px;" class="font-orbitron">✨ Campeões recomendados (BETA)</h4>
                <div class="rec-grid">
                  ${(s.recommendations || []).map(r => `
                    <div class="rec-card">
                      <span class="rec-badge font-orbitron">Escolha forte ${r.strongPick}</span>
                      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                        <img src="${getChampImg(r.champion, s.ddragonVer)}" onerror="this.src='${fallbackIcon}';" style="width: 32px; height: 32px; border-radius: 6px;">
                        <div>
                          <strong style="color: #fff; font-size: 11px;">${r.champion}</strong>
                          <div style="font-size: 9px; color: #94a3b8;">Meio • Topo</div>
                        </div>
                      </div>
                      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 8px; text-align: center; font-size: 9px;">
                        <div style="background: #181e2b; padding: 3px; border-radius: 4px;">
                          <span style="color: #94a3b8; display: block;">Vitória</span>
                          <strong style="color: #10b981;">${r.winRate}%</strong>
                        </div>
                        <div style="background: #181e2b; padding: 3px; border-radius: 4px;">
                          <span style="color: #94a3b8; display: block;">Picks</span>
                          <strong style="color: #fff;">${r.pickRate}%</strong>
                        </div>
                        <div style="background: #181e2b; padding: 3px; border-radius: 4px;">
                          <span style="color: #94a3b8; display: block;">Bans</span>
                          <strong style="color: #f43f5e;">${r.banRate}%</strong>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- ABA 3: CAMPEÕES & CONFRONTOS DIRETO (MATCHUPS) -->
              <div id="ptab-campeoes-${s.id}" class="hidden" style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
                <table style="width: 100%; border-collapse: collapse; min-width: 520px;">
                  <thead>
                    <tr>
                      <th style="padding: 6px;">Campeão</th>
                      <th style="padding: 6px;">Jogado</th>
                      <th style="padding: 6px;">KDA</th>
                      <th style="padding: 6px;">DAN</th>
                      <th style="padding: 6px;">CS</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(s.allChampions || []).map(c => `
                      <tr style="border-bottom: 1px solid #1e293b; background: #0f172a;">
                        <td style="padding: 6px; display: flex; align-items: center; gap: 6px;">
                          <img src="${getChampImg(c.champion, s.ddragonVer)}" onerror="this.src='${fallbackIcon}';" style="width: 26px; height: 26px; border-radius: 4px;">
                          <div>
                            <strong style="color: #fff; font-size: 11px;">${c.champion}</strong>
                            <div style="font-size: 9px; color: ${c.winRate >= 50 ? '#10b981' : '#f43f5e'}; font-weight: 800;">${c.winRate}% (${c.wins}V)</div>
                          </div>
                        </td>
                        <td style="padding: 6px; font-size: 10px;">${c.games}</td>
                        <td style="padding: 6px; font-size: 10px;">${c.avgKDA}</td>
                        <td style="padding: 6px; font-size: 10px;">${c.avgDmgMin}/m</td>
                        <td style="padding: 6px; font-size: 10px;">${c.avgCS} (${c.avgCSMin}/m)</td>
                      </tr>
                      ${(c.matchups || []).map(m => `
                        <tr style="background: #080c16; font-size: 9px; border-bottom: 1px dashed #1e293b;">
                          <td style="padding: 4px 6px 4px 24px; color: #94a3b8;">vs <strong>${m.vs}</strong></td>
                          <td style="padding: 4px 6px;">${m.games}J (${m.winRate}% WR)</td>
                          <td style="padding: 4px 6px;">${m.kda}</td>
                          <td style="padding: 4px 6px;">${m.dmgMin}/m</td>
                          <td style="padding: 4px 6px;">${m.csMin}/m</td>
                        </tr>
                      `).join('')}
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <!-- ABA 4: DESTAQUES -->
              <div id="ptab-destaques-${s.id}" class="hidden">
                <div style="background: #121826; border: 1px solid #1e293b; padding: 16px; border-radius: 10px; text-align: center;">
                  <h4 style="color: #38bdf8; font-size: 12px;" class="font-orbitron">🏆 DESTAQUES RECENTES</h4>
                  <p style="font-size: 10px; color: #94a3b8; margin-top: 4px;">Pentakills, Quadrakills e sequências de vitórias registradas no sistema.</p>
                </div>
              </div>

              <!-- ABA 5: MAESTRIA -->
              <div id="ptab-maestria-${s.id}" class="hidden">
                <div class="mastery-header font-orbitron">
                  <div>
                    <span style="font-size: 9px; text-transform: uppercase;">Pontuação Maestria</span>
                    <h3 style="color: #38bdf8; font-size: 16px;">${(s.mastery?.totalScore || 0).toLocaleString()}</h3>
                  </div>
                  <div>
                    <span style="font-size: 9px; text-transform: uppercase;">Pontos Totais</span>
                    <h3 style="color: #818cf8; font-size: 16px;">${(s.mastery?.totalPoints || 0).toLocaleString()}</h3>
                  </div>
                  <div>
                    <span style="font-size: 9px; text-transform: uppercase;">Campeões</span>
                    <h3 style="color: #10b981; font-size: 16px;">${s.mastery?.championsCount || 0} / ${s.mastery?.totalAvailable || 173}</h3>
                  </div>
                </div>

                <div class="mastery-grid">
                  ${(s.mastery?.list || []).map(m => `
                    <div class="mastery-card">
                      <img src="${getChampImg(m.champion, s.ddragonVer)}" onerror="this.src='${fallbackIcon}';" class="mastery-img">
                      <span class="mastery-badge-lvl font-orbitron">${m.level}</span>
                      <strong style="color: #fff; font-size: 10px; display: block; margin-top: 4px;">${m.champion}</strong>
                      <span style="font-size: 8px; color: #94a3b8; display: block;">${(m.points).toLocaleString()}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- ABA 6: JOGO AO VIVO -->
              <div id="ptab-live-${s.id}" class="hidden">
                ${renderLiveTab(s)}
              </div>

            </td>
          </tr>
        `;
      }).join('');
      lucide.createIcons();
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const queueNamesPT = {
      420: 'Ranqueada Solo/Duo', 440: 'Ranqueada Flex', 450: 'ARAM',
      400: 'Normal (Escolha Livre)', 430: 'Normal (Escolha às Cegas)',
      490: 'Normal Rápida', 1700: 'Arena', 700: 'Clash'
    };

    function renderLiveTab(s) {
      const live = s.liveGame;
      if (!live || !live.inGame || !live.data) {
        return `
          <div style="background: #121826; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; text-align: center;">
            <h3 style="color: #ffffff; font-size: 12px;" class="font-orbitron">"${escapeHtml(s.gameName)}#${escapeHtml(s.tagLine)}" não está em partida ativa.</h3>
            <p style="font-size: 10px; color: #94a3b8; margin-top: 4px;">O painel é atualizado automaticamente. Se o Invocador entrou agora num jogo, aguarde a próxima atualização.</p>
          </div>`;
      }

      const d = live.data;
      const ver = s.ddragonVer;
      const me = `${s.gameName}#${s.tagLine}`.toLowerCase();
      const modeName = queueNamesPT[d.queueId] || d.gameMode || 'Partida';
      const participants = d.participants || [];

      const renderTeam = (teamId, title, color, bg) => `
        <div style="background: ${bg}; padding: 8px; border-radius: 8px; border-left: 3px solid ${color};">
          <strong style="color: ${color}; display: block; margin-bottom: 6px; font-size: 10px;" class="font-orbitron">${title}</strong>
          ${participants.filter(p => p.teamId === teamId).map(p => {
            const isMe = String(p.riotId || '').toLowerCase() === me;
            return `
              <div style="display: flex; align-items: center; gap: 6px; padding: 3px 0; ${isMe ? 'background: rgba(250, 204, 21, 0.12); border-radius: 4px; padding-left: 4px;' : ''}">
                <img src="${getChampImg(p.champion, ver)}" onerror="this.src='${fallbackIcon}';" style="width: 22px; height: 22px; border-radius: 4px;">
                <div style="min-width: 0;">
                  <strong style="color: #fff; font-size: 10px;">${escapeHtml(p.champion)}</strong>
                  <div style="font-size: 9px; color: ${isMe ? '#facc15' : '#94a3b8'}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(p.riotId)}</div>
                </div>
              </div>`;
          }).join('')}
        </div>`;

      return `
        <div style="background: linear-gradient(90deg, rgba(225, 29, 72, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 10px; padding: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px;">
            <span style="color: #f43f5e; font-weight: 800; font-size: 11px; display: flex; align-items: center; gap: 6px;" class="font-orbitron">
              <span style="width: 8px; height: 8px; background: #f43f5e; border-radius: 50%; display: inline-block; animation: livePulse 1.5s infinite;"></span>
              PARTIDA EM ANDAMENTO • ${escapeHtml(modeName)}
            </span>
            <span style="color: #94a3b8; font-size: 10px; font-weight: 700;">⏱️ ${escapeHtml(d.gameTimeFormatted)} <span style="font-weight: 400;">(na última atualização)</span></span>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            ${renderTeam(100, 'TIME AZUL', '#38bdf8', 'rgba(56, 189, 248, 0.08)')}
            ${renderTeam(200, 'TIME VERMELHO', '#f43f5e', 'rgba(244, 63, 94, 0.08)')}
          </div>
        </div>`;
    }

    function renderPlayerMatches(sId, matches, selectedQueue, selectedYear, ver) {
      if (!matches || matches.length === 0) return '<p style="text-align: center; padding: 12px; font-size: 11px;">Nenhuma partida encontrada.</p>';

      const filtered = matches.filter(m => {
        const matchQueue = selectedQueue === 'ALL' || m.queueCategory === selectedQueue;
        const matchYear = selectedYear === 'ALL' || m.seasonYear === selectedYear;
        return matchQueue && matchYear;
      });

      if (filtered.length === 0) {
        return '<div style="background: #121826; padding: 14px; text-align: center; border-radius: 8px; color: #94a3b8; font-size: 11px;">Nenhum histórico para os filtros selecionados.</div>';
      }

      return filtered.map((m, idx) => renderMatchCard(sId, idx, m, ver)).join('');
    }

    function filterMatches(sId) {
      const s = summoners.find(x => x.id === sId);
      if (!s) return;

      const qVal = document.getElementById(`filter-queue-${sId}`).value;
      const yVal = document.getElementById(`filter-year-${sId}`).value;

      const container = document.getElementById(`matches-container-${sId}`);
      container.innerHTML = renderPlayerMatches(sId, s.history, qVal, yVal, s.ddragonVer);
      lucide.createIcons();
    }

    function renderMatchCard(sId, mIdx, m, ver) {
      const cardId = `match-${sId}-${mIdx}`;
      return `
        <div class="match-summary-card ${m.win ? 'match-win-bg' : 'match-loss-bg'}">
          <div class="match-summary-header" onclick="toggleMatchDetail('${cardId}')">
            <div style="display: flex; align-items: center; gap: 8px;">
              <img src="${getChampImg(m.champion, ver)}" onerror="this.src='${fallbackIcon}';" style="width: 30px; height: 30px; border-radius: 6px;">
              <div>
                <strong style="color: #fff; font-size: 11px;">${m.champion}</strong>
                <span style="font-size: 10px; font-weight: 800; margin-left: 4px; color: ${m.win ? '#10b981' : '#f43f5e'};">${m.win ? 'VITÓRIA' : 'DERROTA'}</span>
                <div style="font-size: 9px; color: #94a3b8;">${m.type} • ${m.time} (${m.duration})</div>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="text-align: center;">
                <strong style="color: #fff; font-size: 11px;">${m.kills}/${m.deaths}/${m.assists} <span style="color: #38bdf8; font-size: 9px;">(${m.pKillPct}%)</span></strong>
                <div style="font-size: 8px; color: #94a3b8;">KDA / P/Kill</div>
              </div>
              <span class="op-score-badge font-orbitron">${m.opScore} OP</span>
              <button class="btn-detail-match font-orbitron">Detalhes ▼</button>
            </div>
          </div>

          <div id="detail-${cardId}" class="match-detail-content hidden">
            <div style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 4px 8px; font-weight: 800; font-size: 10px;">Equipe Azul (Vitória)</div>
            ${(m.blueTeam || []).map(p => renderPlayerRowOP(p, m.blueStats.damage, ver)).join('')}

            <div style="background: rgba(244, 63, 94, 0.15); color: #f43f5e; padding: 4px 8px; font-weight: 800; font-size: 10px; margin-top: 6px;">Equipe Vermelha (Derrota)</div>
            ${(m.redTeam || []).map(p => renderPlayerRowOP(p, m.redStats.damage, ver)).join('')}
          </div>
        </div>
      `;
    }

    function renderPlayerRowOP(p, maxTeamDamage, ver) {
      const maxDmg = maxTeamDamage > 0 ? maxTeamDamage : 1;
      const dmgPercent = Math.min(100, Math.round((p.damage / maxDmg) * 100));

      return `
        <div class="player-row-op">
          <div style="display: flex; align-items: center; gap: 6px;">
            <img src="${getChampImg(p.champion, ver)}" onerror="this.src='${fallbackIcon}';" style="width: 20px; height: 20px; border-radius: 4px;">
            <strong style="color: #fff;">${p.name}</strong>
          </div>
          <div><span class="op-score-badge">${p.opScore}</span></div>
          <div>${p.kills}/${p.deaths}/${p.assists} (${p.pKillPct}%)</div>
          <div>
            <div style="font-size: 9px;">${p.damage.toLocaleString()}</div>
            <span class="${p.win ? 'bar-dmg-blue' : 'bar-dmg'}" style="width: ${dmgPercent}%;"></span>
          </div>
          <div>${p.cs} (${p.csMin}/m)</div>
          <div>
            ${(p.items || []).map(i => i > 0 ? `<img src="https://ddragon.leagueoflegends.com/cdn/${ver || '14.20.1'}/img/item/${i}.png" class="item-icon" onerror="this.style.display='none';">` : `<span class="item-icon"></span>`).join('')}
          </div>
        </div>
      `;
    }

    function toggleExpand(id) {
      document.getElementById(`expand-${id}`).classList.toggle('hidden');
    }

    function toggleMatchDetail(cardId) {
      document.getElementById(`detail-${cardId}`).classList.toggle('hidden');
    }

    function switchPlayerTab(sId, tabName) {
      ['resumo', 'estilo', 'campeoes', 'destaques', 'maestria', 'live'].forEach(t => {
        const ptab = document.getElementById(`ptab-${t}-${sId}`);
        const pnav = document.getElementById(`pnav-${t}-${sId}`);
        if(ptab) ptab.classList.add('hidden');
        if(pnav) pnav.classList.remove('active');
      });
      document.getElementById(`ptab-${tabName}-${sId}`).classList.remove('hidden');
      document.getElementById(`pnav-${tabName}-${sId}`).classList.add('active');
    }
  </script>
</body>
</html>
