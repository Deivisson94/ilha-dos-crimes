name: Atualizar Ilha dos Crimes

on:
  schedule:
    - cron: '*/10 * * * *'  # Executa automaticamente a cada 10 minutos
  workflow_dispatch:      # Permite o botão manual e via API do site

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de atualização
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python atualizar.py

      - name: Sincronizar com o repositório remoto
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: Guardar alterações no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: atualização automática via painel"
          branch: main
