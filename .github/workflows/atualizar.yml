name: Atualizar Ilha dos Crimes

on:
  schedule:
    - cron: '*/15 * * * *'  # A cada 15 minutos (a execução leva ~3 min; evita sobreposição)
  workflow_dispatch:        # Permite o botão manual e via API do site

permissions:
  contents: write           # necessário para o bot fazer commit/push

# Nunca roda duas atualizações ao mesmo tempo (principal causa do erro non-fast-forward)
concurrency:
  group: atualizar-ilha-dos-crimes
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de atualização
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python atualizar.py

      - name: Salvar alterações no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "bot: atualização automática via painel"

          # Se você subiu algo no GitHub durante a execução, integra suas mudanças
          # e, em conflito, mantém os dados novos do bot (-X theirs = commit do bot).
          for tentativa in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push falhou (tentativa $tentativa). Tentando novamente..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Não foi possível enviar as alterações."
          exit 1
